<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1c1f24" />
  <title>ControlPlane · Clearance Receipt</title>
  <link rel="stylesheet" href="/static/css/bay.css" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <style>
    @media print {
      body {
        margin: 0;
        padding: 0;
        background: white;
        color: black;
      }
      .shell {
        margin: 0;
        padding: 0;
      }
      header.rail,
      footer.colophon,
      .toolbar,
      .no-print {
        display: none;
      }
      .page {
        max-width: 8.5in;
        height: 11in;
        margin: 0;
        padding: 0.5in;
        page-break-after: avoid;
      }
      .receipt-container {
        page-break-inside: avoid;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
    }

    .receipt-container {
      font-family: "Courier New", monospace;
      line-height: 1.5;
      color: #1c1f24;
    }

    .receipt-header {
      text-align: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #999;
      padding-bottom: 1rem;
    }

    .receipt-header h1 {
      margin: 0 0 0.25rem 0;
      font-size: 1.25rem;
      font-weight: bold;
    }

    .receipt-header .subtitle {
      margin: 0;
      font-size: 0.9rem;
      color: #555;
    }

    .receipt-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .receipt-meta dt {
      font-weight: bold;
      color: #333;
    }

    .receipt-meta dd {
      margin: 0;
      color: #555;
    }

    .receipt-section {
      margin-bottom: 1.5rem;
      border-left: 2px solid #999;
      padding-left: 1rem;
    }

    .receipt-section h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .actuator-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 1rem;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: #f5f5f5;
      border: 1px solid #ccc;
    }

    .actuator-label {
      font-weight: bold;
      color: #d97706;
    }

    .actuator-desc {
      font-size: 0.9rem;
      color: #333;
    }

    .clause-note {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .held-language {
      background: #e8f4f8;
      border-left: 4px solid #0284c7;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      line-height: 1.6;
      font-style: italic;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 0.25rem;
      font-weight: bold;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .status-escalate {
      background: #fed7aa;
      color: #92400e;
    }

    .status-edit {
      background: #fecaca;
      color: #7f1d1d;
    }

    .evidence-link {
      font-size: 0.85rem;
      color: #0284c7;
      text-decoration: underline;
    }

    .receipt-footer {
      margin-top: 2rem;
      border-top: 1px solid #999;
      padding-top: 1rem;
      font-size: 0.8rem;
      color: #666;
      text-align: center;
    }

    .error-state {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      padding: 1rem;
      border-radius: 0.5rem;
      color: #991b1b;
    }

    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid #ccc;
      border-top: 2px solid #1c1f24;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toolbar {
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .toolbar button,
    .toolbar a {
      padding: 0.5rem 1rem;
      background: #1c1f24;
      color: white;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .toolbar button:hover,
    .toolbar a:hover {
      background: #333;
    }
  </style>
  <script src="/static/js/bay.js"></script>
</head>
<body>
  <a class="skip" href="#receipt">Skip to receipt</a>
  <div class="shell">
    <header class="rail">
      <a class="mark" href="/">Control<em>Plane</em></a>
      <span class="mode-stamp">Operate</span>
      <nav class="nav" aria-label="Operate">
        <a href="/" data-nav="clearance">Clearance</a>
        <a href="/policies" data-nav="policies">Policies</a>
        <a href="/metrics" data-nav="metrics">Metrics</a>
        <a href="/audit" data-nav="audit">Audit</a>
        <a href="/matrix" data-nav="matrix">Matrix</a>
        <a href="/architecture" data-nav="architecture">Architecture</a>
        <a href="/runbook" data-nav="runbook">Runbook</a>
        <a href="/print" data-nav="print">Print</a>
      </nav>
      <div class="rail-status">
        <span class="lamp" id="lamp" aria-hidden="true"></span>
        <span id="healthText">checking bay...</span>
      </div>
    </header>

    <main class="page" id="receipt">
      <div class="toolbar no-print">
        <button type="button" id="printBtn">🖨️ Print</button>
        <button type="button" id="refreshBtn">🔄 Refresh</button>
        <a href="/" class="back-link">← Back to Clearance</a>
      </div>

      <div id="receiptContent">
        <div style="text-align: center; padding: 2rem;">
          <div class="spinner"></div>
          <p>Loading last clearance decision...</p>
        </div>
      </div>
    </main>

    <footer class="colophon">ControlPlane · Choda Srujan Sai · Dhrithika · IIT Gandhinagar · PS #1</footer>
  </div>

  <script>
    async function loadLastRequest() {
      const contentDiv = document.getElementById('receiptContent');
      
      try {
        // Check URL params first
        const params = new URLSearchParams(window.location.search);
        let requestId = params.get('request_id');
        
        // If not provided, fetch the last one
        if (!requestId) {
          const listRes = await fetch('/v1/controlplane/requests?limit=1&offset=0');
          if (!listRes.ok) throw new Error('Failed to fetch requests');
          const listData = await listRes.json();
          const requests = listData.requests || [];
          if (!requests.length) {
            contentDiv.innerHTML = `
              <div class="error-state">
                <strong>No decisions found.</strong> Run a clearance scenario first to generate a receipt.
              </div>
            `;
            return;
          }
          requestId = requests[0].request_id;
        }
        
        // Fetch the full request
        const res = await fetch(`/v1/controlplane/requests/${encodeURIComponent(requestId)}`);
        if (!res.ok) throw new Error('Failed to fetch request');
        const data = await res.json();
        
        renderReceipt(data);
      } catch (err) {
        contentDiv.innerHTML = `
          <div class="error-state">
            <strong>Error loading receipt:</strong> ${err.message}
          </div>
        `;
        console.error(err);
      }
    }

    function renderReceipt(data) {
      const contentDiv = document.getElementById('receiptContent');
      const decisions = data.decisions || {};
      const overlay = data.response_overlay || {};
      const ledger = data.ledger || {};
      
      // Collect actuators
      const actuators = [];
      for (const [action, decision] of Object.entries(decisions)) {
        const dec = decision;
        if (typeof dec === 'object') {
          actuators.push({
            action,
            actuator: dec.actuator || 'unknown',
            description: dec.description || '',
          });
        }
      }
      
      // Determine status
      let statusHTML = '';
      const wouldHold = data.would_hold || false;
      const enforced = data.enforced || false;
      if (wouldHold) {
        statusHTML = `<span class="status-badge status-escalate">HELD & ESCALATED</span>`;
      } else {
        statusHTML = `<span class="status-badge status-edit">ADMITTED</span>`;
      }
      
      // Check if clause_72 claim exists and has no spans
      const claims = ledger.claims || [];
      const clause72 = claims.find(c => c.id === 'clause_72');
      const clause72Unsupported = clause72 && !clause72.evidence_spans?.length;
      
      let html = `
        <div class="receipt-container">
          <div class="receipt-header">
            <h1>Clearance Receipt</h1>
            <p class="subtitle">Admission Control Decision</p>
          </div>
          
          <div class="receipt-meta">
            <div>
              <dt>Request ID</dt>
              <dd>${data.request_id || 'N/A'}</dd>
            </div>
            <div>
              <dt>Use Case</dt>
              <dd>${data.use_case || 'N/A'}</dd>
            </div>
            <div>
              <dt>Mode</dt>
              <dd>${data.mode || 'N/A'}</dd>
            </div>
            <div>
              <dt>Status</dt>
              <dd>${statusHTML}</dd>
            </div>
          </div>
      `;
      
      // If clause 7.2 is unsupported, show the note
      if (clause72Unsupported) {
        html += `
          <div class="clause-note">
            <strong>⚠️ Clause 7.2 Does Not Exist</strong><br>
            Absence of evidence is not conflicting evidence. Claims must earn their verdict.
            Default verdict is <span class="mono">UNSUPPORTED</span>. This claim was not proven.
          </div>
        `;
      }
      
      // Actions pending
      if (actuators.length > 0) {
        html += `<div class="receipt-section">
          <h2>Pending Actions</h2>
        `;
        
        for (const act of actuators) {
          const isEscalate = act.actuator === 'Escalate' || act.actuator === 'escalate';
          const isEdit = act.actuator === 'Edit' || act.actuator === 'edit';
          const badgeClass = isEscalate ? 'status-escalate' : isEdit ? 'status-edit' : '';
          
          html += `
            <div class="actuator-row">
              <div class="actuator-label">
                <span class="status-badge ${badgeClass}">${act.actuator}</span>
              </div>
              <div class="actuator-desc">
                <strong>${act.action}</strong>: ${act.description || 'Action pending'}
              </div>
            </div>
          `;
        }
        
        html += `</div>`;
      }
      
      // Held language (only if escalation present)
      if (wouldHold) {
        html += `
          <div class="held-language">
            💾 <strong>Action held and escalated with evidence packet.</strong>
            This irreversible action is not released until additional evidence clears the holdback condition.
            Review the evidence ledger and matrix cell for the blocking rule.
          </div>
        `;
      }
      
      // Evidence and audit trail
      html += `
        <div class="receipt-section">
          <h2>Evidence & Verification</h2>
          <p>
            Chain Valid: <strong>${data.chain_valid ? 'Yes ✓' : 'No ✗'}</strong>
          </p>
          <p>
            <a href="/v1/controlplane/requests/${encodeURIComponent(data.request_id)}/audit.jsonl" class="evidence-link">
              📋 Download audit.jsonl
            </a>
            &nbsp;&nbsp;
            <a href="/v1/controlplane/requests/${encodeURIComponent(data.request_id)}/audit.jsonl.sig" class="evidence-link">
              🔐 Download signature
            </a>
          </p>
        </div>
      `;
      
      // Footer
      html += `
        <div class="receipt-footer">
          <p>Generated by ControlPlane.ai · Admission Control Layer</p>
          <p style="font-size: 0.75rem; color: #999;">
            Latency: ${data.latency_ms?.toFixed(2)}ms
          </p>
        </div>
        
        </div>
      `;
      
      contentDiv.innerHTML = html;
    }

    // Event listeners
    document.getElementById('printBtn')?.addEventListener('click', () => {
      window.print();
    });

    document.getElementById('refreshBtn')?.addEventListener('click', () => {
      document.getElementById('receiptContent').innerHTML = `
        <div style="text-align: center; padding: 2rem;">
          <div class="spinner"></div>
          <p>Loading last clearance decision...</p>
        </div>
      `;
      loadLastRequest();
    });

    // Load on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadLastRequest();
    });
  </script>
</body>
</html>
